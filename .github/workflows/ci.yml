name: RuangPintar CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & PWA Production Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Typecheck & Lint (TypeScript)
        run: npm run lint

      - name: 2. Run Comprehensive Unit & Integration Test Suite
        run: npm test

      - name: 3. Compile Production PWA Bundle
        run: npm run build
